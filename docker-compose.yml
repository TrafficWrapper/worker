x-base: &base
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true

x-defaults: &defaults
  <<: *base
  restart: unless-stopped

services:
  agent:
    <<: *defaults
    image: ghcr.io/trafficwrapper/worker-agent:${WORKER_VERSION:-local}
    build:
      context: .
      dockerfile: agent/Dockerfile
      args:
        VERSION: ${WORKER_VERSION:-dev}
    env_file: .env
    environment:
      WORKER_STATE_DIR: /worker-state
      AWG_UAPI_SOCKET: /var/run/wireguard/awg1.sock
      XRAY_API_SOCKET: /run/xray-api/api.sock
      # Soft heap target below mem_limit: the Go GC works harder before the
      # container is killed (an inline APK from an older orchestrator is
      # decoded in memory).
      GOMEMLIMIT: 320MiB
    volumes:
      - ./worker-state:/worker-state
      - awg-run:/var/run/wireguard
      - xray-api:/run/xray-api
    ports:
      - "127.0.0.1:${AGENT_PORT:-9090}:9090/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 448m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/usr/local/bin/worker-agent", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  awg-gw:
    <<: *defaults
    image: ghcr.io/trafficwrapper/worker-awg-gw:${WORKER_VERSION:-local}
    build:
      context: .
      dockerfile: awg-gw/Dockerfile
      args:
        VERSION: ${WORKER_VERSION:-dev}
    depends_on:
      agent:
        condition: service_healthy
    command: ["run", "--config", "/worker-state/awg/awg-gw.json"]
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file: .env
    volumes:
      - ./worker-state:/worker-state
      - awg-run:/var/run/wireguard
    ports:
      - "${AWG_PORT:-51888}:51821/udp"
    mem_limit: 512m
    pids_limit: 512
    healthcheck:
      test: ["CMD", "/usr/local/bin/awg-gw", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  distributor:
    <<: *defaults
    image: ghcr.io/trafficwrapper/worker-distributor:${WORKER_VERSION:-local}
    build:
      context: distributor
    depends_on:
      awg-gw:
        condition: service_healthy
    network_mode: "service:awg-gw"
    env_file: .env
    environment:
      AWG_GATEWAY: ${AWG_GATEWAY:-10.13.13.1}
    volumes:
      - ./worker-state/distributor:/worker-state/distributor:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 128m
    pids_limit: 256
    healthcheck:
      # Healthy only inside the namespace that has the tunnel gateway.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz && ip addr | grep -q \"$${AWG_GATEWAY}/\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  dns:
    <<: *defaults
    profiles: ["dns"]
    image: ghcr.io/trafficwrapper/worker-dns:${WORKER_VERSION:-local}
    build:
      context: dns
    depends_on:
      awg-gw:
        condition: service_healthy
    network_mode: "service:awg-gw"
    environment:
      AWG_GATEWAY: ${AWG_GATEWAY:-10.13.13.1}
      DNS_UPSTREAMS: ${DNS_UPSTREAMS:-https://dns.quad9.net/dns-query https://cloudflare-dns.com/dns-query}
      DNS_BOOTSTRAP: ${DNS_BOOTSTRAP:-9.9.9.9:53}
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    mem_limit: 128m
    pids_limit: 128
    healthcheck:
      # Ask on the tunnel gateway address, which exists only inside the
      # namespace AWG clients use.
      test: ["CMD-SHELL", "nslookup localhost \"$${AWG_GATEWAY}\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  xray:
    <<: *defaults
    image: ghcr.io/trafficwrapper/worker-xray:${WORKER_VERSION:-local}
    build:
      context: xray
    depends_on:
      agent:
        condition: service_healthy
      distributor:
        condition: service_healthy
    environment:
      XRAY_API_SOCKET: /run/xray-api/api.sock
    volumes:
      - ./worker-state:/worker-state:ro
      - xray-api:/run/xray-api
    ports:
      - "${XRAY_PORT:-2053}:8443/tcp"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 512m
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "grep -qsE ':20FB [0-9A-F]+:0000 0A' /proc/net/tcp /proc/net/tcp6"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  awg-smoke:
    <<: *base
    profiles: ["smoke"]
    image: ghcr.io/trafficwrapper/worker-awg-smoke:${WORKER_VERSION:-local}
    build:
      context: .
      dockerfile: awg-smoke/Dockerfile
    depends_on:
      - awg-gw
      - distributor
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./worker-state:/worker-state
    environment:
      WORKER_STATE_DIR: /worker-state
      AWG_ENDPOINT: host.docker.internal:${AWG_PORT:-51888}
      AWG_GATEWAY: ${AWG_GATEWAY:-10.13.13.1}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  awg-run:
  xray-api:
