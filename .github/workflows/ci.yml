name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - agent
          - awg-gw
          - awg-smoke
          - core
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"

      - name: Format
        working-directory: ${{ matrix.module }}
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

      - name: Vulnerability check
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - agent
          - awg-gw
          - awg-smoke
          - core
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yml

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck install.sh uninstall.sh distributor/entrypoint.sh dns/entrypoint.sh xray/entrypoint.sh tests/install_env_test.sh tests/install_ports_test.sh

      - name: install.sh tests
        run: |
          bash tests/install_env_test.sh
          bash tests/install_ports_test.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose --profile smoke --profile dns config --quiet

      - name: Build images
        run: docker compose --profile smoke --profile dns build

      - name: Check distributor nginx config
        run: |
          mkdir -p "$RUNNER_TEMP/state/distributor/certs"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 -subj /CN=ci \
            -keyout "$RUNNER_TEMP/state/distributor/certs/tls.key" -out "$RUNNER_TEMP/state/distributor/certs/tls.crt"
          image=ghcr.io/trafficwrapper/worker-distributor:local
          docker run --rm --add-host agent:127.0.0.1 -v "$RUNNER_TEMP/state:/worker-state:ro" --entrypoint sh "$image" -c \
            'sed "s/__AWG_GATEWAY__/10.13.13.1/g" /etc/nginx/templates/worker.conf.template >/etc/nginx/conf.d/default.conf && nginx -t'
