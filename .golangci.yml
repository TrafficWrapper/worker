version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - all
        - -SA1019
        - -QF*
        - -ST*
  exclusions:
    generated: lax
    paths:
      - core/awg/device/
    rules:
      - path: _test\.go
        linters:
          - unused
